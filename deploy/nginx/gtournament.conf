server {
    listen 80;
    server_name gtournament.online www.gtournament.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gtournament.online www.gtournament.online;
    root /var/www/GTournament1;
    index index.php;
    server_tokens off;

    # Replace with paths managed by the VPS certificate provider.
    ssl_certificate /etc/letsencrypt/live/gtournament.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtournament.online/privkey.pem;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ /.(?!well-known) { deny all; return 404; }
    location ~* /(?:\.git|\.env|database|tests|storage|deploy|README|DEVELOPMENT_LOG|SYSTEM_ANALYSIS|.*\.sql|.*\.md) { deny all; return 404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
